<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Moctezuma Records</title>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Clients that read <style> (Apple Mail, iOS, Outlook.com) get the phone layout and the entrance;
           the rest show the same email, still. */
        @media (max-width: 620px) {
            .px { padding-left: 20px !important; padding-right: 20px !important; }
            .stack { display: block !important; width: 100% !important; padding: 0 0 12px !important; }
            .btn { display: block !important; text-align: center !important; }
            .h1 { font-size: 22px !important; }
        }
        @media (prefers-reduced-motion: no-preference) {
            .enter { animation: enter .7s cubic-bezier(.16, 1, .3, 1) both; }
            .enter-2 { animation-delay: .12s; }
            .enter-3 { animation-delay: .24s; }
            @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#fff6e1;font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;color:#0f3f67;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
        {% block preheader %}Moctezuma Records{% endblock %}
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff6e1;">
        <tr>
            <td align="center" style="padding:24px 12px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
                    <tr>
                        <td class="px" style="padding:4px 32px 18px;">
                            <a href="{{ frontend_url|default:"https://moctezumarecords.com" }}" style="text-decoration:none;font-family:'Krona One','Helvetica Neue',Arial,sans-serif;font-size:15px;letter-spacing:1px;color:#0f3f67;">
                                MOCTEZUMA <span style="color:#f4903c;">RECORDS</span>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="background:#ffffff;border-radius:24px;border:1px solid #f3e6c9;overflow:hidden;">
                            <div style="height:6px;background:#f4903c;background-image:linear-gradient(120deg,#f8d15a,#f4b03c 22%,#e85f3c 48%,#f4b03c 74%,#f8d15a);"></div>
                            <div class="px" style="padding:28px 32px 32px;">
                                {% block content %}{% endblock %}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="px" style="padding:22px 32px 0;color:#57718a;font-size:12px;line-height:1.7;">
                            {% block footer_note %}{% endblock %}
                            Moctezuma Records · Tienda de discos de vinilo en la CDMX<br>
                            <a href="{{ frontend_url|default:"https://moctezumarecords.com" }}" style="color:#0f3f67;font-weight:600;text-decoration:none;">moctezumarecords.com</a>
                            · ¡Gracias por apoyar la música!
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
