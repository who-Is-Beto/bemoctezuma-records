name: Backend CI

# Merge blocker: runs pytest on every PR and on pushes to main/stage.
# Enable branch protection on `main` and require this check to merge.

on:
  pull_request:
  push:
    branches: [main, stage]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      # settings.py reads DJANGO_SECRET_KEY at import time. CI runs against
      # SQLite (tests are hermetic — Stripe/shipping/discogs are all mocked),
      # so any non-empty value is fine here.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q